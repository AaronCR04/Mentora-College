<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página No Encontrada (404) | Mentora College</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/main.css?v=8">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
  <!-- Header y Drawer de Navegación Componetizados -->
  <include src="/components/header.html"></include>
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 4rem 1rem;">
    <div style="text-align: center; max-width: 500px;">
      <div style="font-family: var(--font-heading); font-size: 5rem; font-weight: 800; color: var(--mentora-purple); line-height: 1;">404</div>
      <h1 style="font-size: 1.75rem; margin: 1rem 0;">Página No Encontrada</h1>
      <p style="color: var(--text-muted); margin-bottom: 2rem;">La página que estás buscando no existe o se ha movido a una nueva dirección.</p>
      <a href="./" class="btn btn-primary">Ir a la página principal →</a>
    </div>
  </main>
    <!-- ==========================================================================
       FOOTER INSTITUCIONAL
       ========================================================================== -->
  <!-- Componente Reutilizable: Footer -->
  <include src="/components/footer.html"></include>

  <!-- Modal Lead Popup Container -->
  <div class="modal-overlay" id="leadModalOverlay">
    <div class="modal-container">
      <button class="modal-close" id="modalCloseBtn" aria-label="Cerrar ventana">✕</button>
      <h3 style="margin-bottom: 0.5rem; font-size: 1.35rem; font-family: 'Sora', sans-serif;">Solicitar Presentación
        Institucional</h3>
      <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem;">Un especialista de Mentora
        College se contactará contigo para coordinar una demostración personalizada.</p>

      <form class="lead-form-element" method="POST">
        <div class="form-group">
          <label class="form-label" for="modal_nombre">Nombre y apellido *</label>
          <input class="form-input" type="text" id="modal_nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="modal_colegio">Nombre del colegio *</label>
          <input class="form-input" type="text" id="modal_colegio" name="colegio" placeholder="Ej. Colegio Innova"
            required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="modal_cargo">Cargo *</label>
            <select class="form-select" id="modal_cargo" name="cargo" required>
              <option value="">Selecciona...</option>
              <option value="Director / Promotor">Director / Promotor</option>
              <option value="Coordinador Académico">Coordinador Académico</option>
              <option value="TI / Transformación Digital">TI / Transformación Digital</option>
              <option value="Docente">Docente</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="modal_email">Correo institucional *</label>
            <input class="form-input" type="email" id="modal_email" name="email" placeholder="jperez@colegio.edu"
              required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="modal_telefono">Teléfono / WhatsApp *</label>
          <input class="form-input" type="tel" id="modal_telefono" name="telefono" placeholder="+51 987 654 321"
            required>
        </div>

        <div class="form-group">
          <label class="form-label" for="modal_interes">Interés principal *</label>
          <select class="form-select" id="modal_interes" name="interes" required>
            <option value="Solución integral">Solución integral 360°</option>
            <option value="Gestión académica">Gestión académica y Boletas</option>
            <option value="Planificación y evaluación">Planificación y evaluación por competencias</option>
            <option value="Monitoreo del aprendizaje">Monitoreo del aprendizaje</option>
            <option value="Inteligencia Artificial">Inteligencia Artificial Educativa</option>
          </select>
        </div>

        <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 0.5rem;">
          Quiero conocer Mentora College →
        </button>
      </form>
    </div>
  </div>

  <!-- Main JavaScript App -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
