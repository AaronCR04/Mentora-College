<!-- ==========================================================================
     COMPONENTE REUTILIZABLE: HEADER & MOBILE DRAWER
     ========================================================================== -->
<header class="header-v2-wrapper" id="mainHeader">
  <div class="header-v2">
    <!-- Logo -->
    <a href="/" class="logo-brand-v2 flex items-center" aria-label="Mentora College - Inicio">
      <img src="/assets/logos/logo.png" alt="Mentora College" class="brand-logo-img" height="40">
    </a>

    <!-- Enlaces de navegación Desktop -->
    <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-700 nav-desktop-v2">
      <a href="/#beneficios" class="hover:text-purple-700 transition-colors nav-link-v2">Beneficios</a>
      <a href="/#porque-mentora" class="hover:text-purple-700 transition-colors nav-link-v2">Nosotros</a>
      <a href="/#ia" class="hover:text-purple-700 transition-colors nav-link-v2">Soluciones IA</a>
    </nav>

    <!-- Botón CTA & Mobile Toggle -->
    <div class="flex items-center gap-3">
      <a href="/#contacto"
        class="cta-btn-v2 inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold shadow-md transition-all js-open-lead-modal">
        Más información
        <span class="cta-arrow-circle">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </span>
      </a>

      <!-- Botón menú hamburguesa móvil -->
      <button class="mobile-drawer-toggle" id="mobileDrawerToggle" aria-label="Abrir menú" aria-expanded="false">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
  </div>
</header>

<!-- Mobile Drawer Nav -->
<div class="mobile-drawer" id="mobileDrawerNav">
  <a href="/#beneficios" class="nav-link">Beneficios</a>
  <a href="/#porque-mentora" class="nav-link">Nosotros</a>
  <a href="/#ia" class="nav-link">Soluciones IA</a>
  <div style="margin-top: 1rem;">
    <button class="btn btn-primary js-open-lead-modal" style="width: 100%;">
      Contáctanos
    </button>
  </div>
</div>
